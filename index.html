<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생산 공정 중량 및 일정 관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-dark: #0f766e;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
        }
        
        body { 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            display: flex;
            justify-content: center;
            color: #333;
        }
        .container { 
            width: 100%;
            max-width: 700px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            border-top: 6px solid var(--primary-color);
        }
        h2 { 
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
            color: #1f2937;
        }
        
        .manager-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .manager-section select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 1.05em;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
        }
        
        .form-type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-type-selector label {
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            color: var(--primary-color);
            transition: all 0.2s;
            background: white;
        }
        .form-type-selector input[type="radio"] { display: none; }
        .form-type-selector input[type="radio"]:checked + label {
            background-color: var(--primary-color);
            color: white;
        }

        .upload-section { 
            margin-bottom: 20px; 
            padding: 40px 20px; 
            border: 2px dashed var(--primary-color); 
            background-color: var(--bg-color);
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-section.dragover {
            background-color: #d1fae5;
            border-color: var(--primary-dark);
        }
        .fake-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #fff;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 5px;
            font-weight: bold;
            pointer-events: none; 
        }
        .result-section { 
            margin-top: 20px; 
            display: none; 
        }
        .file-result-card {
            border: 1px solid #e5e7eb;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            position: relative;
        }
        .file-name-title {
            font-size: 0.95em;
            color: #4b5563;
            margin-bottom: 12px;
            word-break: break-all;
            padding-right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .badge.sales { background-color: #dbeafe; color: #1e40af; }
        .badge.design { background-color: #e0e7ff; color: #3730a3; }
        .badge.acc { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.2s;
        }
        .delete-btn:hover { color: #ef4444; }
        
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            background-color: #fff;
            font-weight: bold;
            color: #1f2937;
        }

        .spec-list-wrapper {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        .spec-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .spec-tag {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #334155;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .spec-tag strong {
            color: #0f766e;
            font-size: 1.15em;
        }
        .spec-type-pipe { border-left: 4px solid #3b82f6; } 
        .spec-type-short { border-left: 4px solid #f59e0b; } 
        .spec-type-cbeam { border-left: 4px solid #10b981; } 

        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        button {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.2s;
        }
        button.reset-btn { background-color: #9ca3af; color: white; flex: 1; }
        button.reset-btn:hover { background-color: #6b7280; }
        button.submit-btn { background-color: var(--primary-color); color: white; flex: 2; }
        button.submit-btn:hover { background-color: var(--primary-dark); }
        .info-text { font-size: 0.9em; color: #6b7280; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏭 생산 공정: 견적 중량 & 일정 관리기</h2>

    <div class="manager-section">
        <label for="managerSelect" style="font-weight: bold; color: #1e293b;">👤 담당자:</label>
        <select id="managerSelect" onchange="saveManager()">
            <option value="">담당자 선택</option>
            <option value="오은규">오은규</option>
            <option value="전화진">전화진</option>
            <option value="김정석">김정석</option>
            <option value="김동주">김동주</option>
            <option value="김봉준">김봉준</option>
            <option value="정준우">정준우</option>
            <option value="황지훈">황지훈</option>
            <option value="노성현">노성현</option>
            <option value="권도희">권도희</option>
        </select>
    </div>
    
    <div class="form-type-selector">
        <input type="radio" id="typeSales" name="formType" value="sales" checked>
        <label for="typeSales">영업 견적서 기반</label>
        
        <input type="radio" id="typeDesign" name="formType" value="design">
        <label for="typeDesign">설계 산출서 기반</label>
    </div>

    <div class="upload-section" id="dropZone">
        <p style="margin-top: 0; font-weight: bold; color: #0f766e; pointer-events: none; font-size: 1.1em;">
            엑셀 파일을 이곳으로 드래그 하세요.<br>
            <span style="font-size: 0.85em; color: #6b7280; font-weight: normal;">(모든 파일은 구글 드라이브에 PDF로 자동 변환 저장됩니다)</span>
        </p>
        <div class="fake-btn">클릭하여 파일 선택</div>
        <input type="file" id="excelFile" accept=".xlsx, .xls" multiple style="display: none;" />
    </div>

    <div id="resultArea" class="result-section">
        <div style="font-weight: bold; margin-bottom: 15px; font-size: 1.1em; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">
            📋 추출된 현장별 규격 중량 데이터
        </div>
        
        <div id="resultList"></div>
        
        <div class="action-buttons">
            <button class="reset-btn" onclick="clearList()">목록 초기화</button>
            <button class="submit-btn" onclick="sendToGoogleSheet()">구글 시트로 일괄 업데이트</button>
        </div>
        <p class="info-text">※ 대용량 설계 파일도 '수량산출서'만 추출하여 PDF로 압축 전송합니다.</p>
    </div>
</div>

<script>
    let globalFileCounter = 0;

    document.addEventListener('DOMContentLoaded', () => {
        const savedManager = localStorage.getItem('selectedManager');
        if (savedManager) document.getElementById('managerSelect').value = savedManager;
    });

    function saveManager() {
        const manager = document.getElementById('managerSelect').value;
        localStorage.setItem('selectedManager', manager);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function getNum(val) {
        if (val === undefined || val === null || val === "") return 0;
        let n = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
        return isNaN(n) ? 0 : n;
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('excelFile');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processFiles(e.target.files);
    });

    function clearList() {
        if(confirm("추출된 리스트를 모두 초기화하시겠습니까?")) {
            document.getElementById('resultList').innerHTML = '';
            document.getElementById('resultArea').style.display = "none";
            globalFileCounter = 0;
        }
    }

    function processFiles(files) {
        let formType = document.querySelector('input[name="formType"]:checked').value;
        let resultList = document.getElementById('resultList');
        document.getElementById('resultArea').style.display = "block";

        Array.from(files).forEach((f) => {
            let currentId = globalFileCounter++; 
            let reader = new FileReader();

            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});
                    
                    let projectName = extractProjectName(workbook, formType);
                    let weights = extractWeightsBySpec(workbook, formType);
                    let accessories = extractAccessories(workbook, formType);

                    let specTagsHtml = weights.map(w => `
                        <div class="spec-tag spec-type-${w.type}">
                            ${w.name} <strong>${w.weight.toLocaleString('ko-KR', {maximumFractionDigits: 3})}</strong> kg
                        </div>
                    `).join("") || `<div style="color:#ef4444; font-size:0.9em;">데이터 없음</div>`;

                    let accBadgeHtml = (accessories.hasBracket ? `<span class="badge acc">브라켓 O</span>` : "") + 
                                       (accessories.hasBolt ? `<span class="badge acc">볼트 O</span>` : "");

                    let cardHtml = `
                        <div class="file-result-card" id="card_${currentId}" data-id="${currentId}">
                            <button class="delete-btn" onclick="document.getElementById('card_${currentId}').remove()">✕</button>
                            <div class="file-name-title">📁 ${escapeHtml(f.name)} ${accBadgeHtml}</div>
                            <div class="info-group">
                                <input type="text" id="proj_${currentId}" class="input-field" value="${escapeHtml(projectName)}">
                            </div>
                            <div class="spec-list-wrapper"><div class="spec-list">${specTagsHtml}</div></div>
                            <input type="hidden" id="specData_${currentId}" value='${JSON.stringify(weights)}'>
                            <input type="hidden" id="accData_${currentId}" value='${JSON.stringify(accessories)}'>
                            <input type="hidden" id="fileData64_${currentId}" value="">
                            <input type="hidden" id="fileName_${currentId}" value="${escapeHtml(f.name)}">
                        </div>
                    `;
                    resultList.insertAdjacentHTML('beforeend', cardHtml);

                    // 용량 최적화 (설계 기반일 경우 시트 1개만 추출)
                    let outputB64 = "";
                    if (formType === 'design') {
                        let newWb = XLSX.utils.book_new();
                        let calcSheetName = workbook.SheetNames.find(n => n.includes("수량산출서") || n.includes("산출서")) || workbook.SheetNames[0];
                        if (workbook.Sheets[calcSheetName]) XLSX.utils.book_append_sheet(newWb, workbook.Sheets[calcSheetName], "수량산출서");
                        outputB64 = XLSX.write(newWb, { bookType: 'xlsx', type: 'base64' });
                    } else {
                        outputB64 = dataToBase64(data);
                    }
                    document.getElementById(`fileData64_${currentId}`).value = outputB64;

                } catch (error) { console.error(error); }
            };
            reader.readAsArrayBuffer(f);
        });
    }

    function dataToBase64(uint8) {
        let bin = "";
        for (let i = 0; i < uint8.length; i++) bin += String.fromCharCode(uint8[i]);
        return btoa(bin);
    }

    function extractProjectName(workbook, formType) {
        let company = "업체명미상", site = "현장명미상";
        try {
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            let data = XLSX.utils.sheet_to_json(sheet, {header: 1});
            if (formType === 'sales') {
                for (let i = 0; i < 20; i++) {
                    let cellVal = String(data[i] ? data[i].join("") : "");
                    if (cellVal.includes("견적")) {
                        let m = cellVal.match(/\(([^)]+)\)/);
                        if (m) site = m[1].trim();
                        break;
                    }
                }
                if (data[9] && data[9][2]) company = String(data[9][2]).replace(/주식회사/g, '').trim();
            } else {
                let estSheet = workbook.Sheets["견적서"] || sheet;
                let estData = XLSX.utils.sheet_to_json(estSheet, {header: 1});
                if (estData[10] && estData[10][2]) company = String(estData[10][2]).replace(/주식회사/g, '').trim();
                if (estData[0] && estData[0][25]) site = String(estData[0][25]).trim();
            }
        } catch(e) {}
        return `${company}(${site})`;
    }

    function extractAccessories(workbook, formType) {
        let res = { hasBracket: false, hasBolt: false };
        try {
            let sheetName = formType === 'design' ? (workbook.SheetNames.find(n => n.includes("산출서")) || workbook.SheetNames[0]) : workbook.SheetNames[0];
            let data = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});
            data.forEach(row => {
                let s = row.join("").toUpperCase();
                if (s.includes("브라켓") || s.includes("부자재")) { if(getNum(row[9]||row[7]) > 0) res.hasBracket = true; }
                if (s.includes("BOLT")) { if(getNum(row[9]||row[7]) > 0) res.hasBolt = true; }
            });
        } catch(e) {}
        return res;
    }

    function extractWeightsBySpec(workbook, formType) {
        let sheetName = formType === 'design' ? (workbook.SheetNames.find(n => n.includes("산출서")) || workbook.SheetNames[0]) : workbook.SheetNames[0];
        let json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});
        const pSpecs = [[100,100,3.2],[100,100,3.0],[100,100,2.3],[100,100,2.1],[100,50,2.1],[75,75,2.1],[50,50,2.1]];
        const cSpecs = [[125,50,3.2],[125,50,3.0],[125,50,2.1],[100,50,3.2],[100,50,3.0],[100,50,2.3],[100,50,2.1],[75,45,2.3],[75,45,2.1]];
        let map = {};
        json.forEach(row => {
            let w = getNum(row[10]); if (w <= 0) return;
            let q = getNum(row[9]);
            let d1 = getNum(row[formType==='sales'?2:4]), d2 = getNum(row[formType==='sales'?3:5]), t = getNum(row[formType==='sales'?4:6]), l = getNum(row[formType==='sales'?5:7]);
            if (formType!=='sales') t = getNum(row[7]); 
            
            let isNon = String(row[formType==='sales'?14:2]||"").includes("무타공");
            let pMatch = pSpecs.find(s => s[0]===d1 && s[1]===d2 && s[2]===t);
            if (pMatch) {
                let type = l >= 2 ? 'pipe' : 'short';
                let spec = `${isNon?'무타공 ':''}${d1}x${d2}x${t}`;
                let key = type + spec;
                if(!map[key]) map[key] = { type, name: (type==='pipe'?'각관 ':'단척 ')+spec, spec, weight: 0, qty: 0 };
                map[key].weight += w; if(type==='short') map[key].qty += q;
                return;
            }
            let cMatch = cSpecs.find(s => s[0]===d1 && s[1]===d2 && s[2]===t);
            if (cMatch) {
                let spec = `${isNon?'무타공 ':''}${d1}x${d2}x${t}`;
                let key = 'cbeam' + spec;
                if(!map[key]) map[key] = { type:'cbeam', name: 'C형강 '+spec, spec, weight: 0, qty: 0 };
                map[key].weight += w;
            }
        });
        return Object.values(map).sort((a,b) => a.type.localeCompare(b.type));
    }

    function sendToGoogleSheet() {
        const cards = document.querySelectorAll('.file-result-card');
        const manager = document.getElementById('managerSelect').value;
        if (cards.length === 0 || !manager) return alert("데이터 또는 담당자를 확인하세요.");

        const btn = document.querySelector('.submit-btn');
        btn.innerText = "PDF 변환 및 업로드 중...";
        btn.disabled = true;

        const URL = "https://script.google.com/macros/s/AKfycbwLFCCpzSC2TqwNgrxiGHQV7i-3k9kQgM4lY_qGSHNWiTsC_TqbsG2zD4M8qEU0-cMM/exec"; 
        let now = new Date();
        let yShort = String(now.getFullYear()).slice(-2);
        let mStr = String(now.getMonth()+1).padStart(2,'0');
        let dStr = String(now.getDate()).padStart(2,'0');
        let hStr = String(now.getHours()).padStart(2,'0');
        let minStr = String(now.getMinutes()).padStart(2,'0');
        
        let dateStr = `${yShort}.${mStr}.${dStr} ${hStr}:${minStr}`;

        let promises = Array.from(cards).map(card => {
            let id = card.dataset.id;
            let specData = JSON.parse(document.getElementById(`specData_${id}`).value);
            let accData = JSON.parse(document.getElementById(`accData_${id}`).value);
            let proj = document.getElementById(`proj_${id}`).value;
            
            let payload = {
                date: dateStr, year: now.getFullYear(), month: now.getMonth()+1,
                project: proj, manager, 
                convertToPdf: true, // ★ 무조건 PDF 변환 수행
                pipes: specData.filter(i=>i.type==='pipe'),
                shorts: specData.filter(i=>i.type==='short'),
                cbeams: specData.filter(i=>i.type==='cbeam'),
                hasBracket: accData.hasBracket ? "O" : "",
                hasBolt: accData.hasBolt ? "O" : "",
                fileData: document.getElementById(`fileData64_${id}`).value,
                fileName: `[${dateStr.replace(/:/g,'시')}]_${proj}_${document.getElementById(`fileName_${id}`).value}`
            };

            return fetch(URL, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) });
        });

        Promise.all(promises).then(() => {
            alert("✅ 모든 견적서가 PDF로 변환되어 업로드 완료되었습니다!");
            location.reload();
        }).catch(() => {
            alert("❌ 오류 발생");
            btn.disabled = false;
        });
    }
</script>
</body>
</html>

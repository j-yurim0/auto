<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생산 공정 중량 및 일정 관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary-color: #0d9488; --primary-dark: #0f766e; --bg-color: #f0fdfa; --card-bg: #ffffff; }
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f6; display: flex; justify-content: center; color: #333; }
        .container { width: 100%; max-width: 700px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid var(--primary-color); }
        h2 { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px; color: #1f2937; }
        .manager-section { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; background-color: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .manager-section select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1.05em; font-weight: bold; color: #334155; cursor: pointer; }
        .form-type-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .form-type-selector label { font-size: 1.05em; font-weight: bold; cursor: pointer; padding: 10px 20px; border: 2px solid var(--primary-color); border-radius: 8px; color: var(--primary-color); transition: all 0.2s; background: white; }
        .form-type-selector input[type="radio"] { display: none; }
        .form-type-selector input[type="radio"]:checked + label { background-color: var(--primary-color); color: white; box-shadow: 0 4px 6px rgba(13, 148, 136, 0.2); }
        .upload-section { margin-bottom: 20px; padding: 40px 20px; border: 2px dashed var(--primary-color); background-color: var(--bg-color); text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .upload-section.dragover { background-color: #d1fae5; border-color: var(--primary-dark); }
        .fake-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #fff; border: 1px solid var(--primary-color); color: var(--primary-color); border-radius: 5px; font-weight: bold; pointer-events: none; }
        .result-section { margin-top: 20px; display: none; }
        .file-result-card { border: 1px solid #e5e7eb; padding: 20px; margin-bottom: 15px; border-radius: 8px; background-color: #fafafa; position: relative; }
        .file-name-title { font-size: 0.95em; color: #4b5563; margin-bottom: 12px; word-break: break-all; padding-right: 30px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .badge.sales { background-color: #dbeafe; color: #1e40af; }
        .badge.design { background-color: #e0e7ff; color: #3730a3; }
        .badge.acc { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #9ca3af; font-size: 1.2em; cursor: pointer; font-weight: bold; transition: color 0.2s; }
        .delete-btn:hover { color: #ef4444; }
        .info-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1em; box-sizing: border-box; background-color: #fff; font-weight: bold; color: #1f2937; }
        .spec-list-wrapper { background: white; padding: 15px; border-radius: 6px; border: 1px solid #e5e7eb; }
        .spec-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .spec-tag { background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 5px; }
        .spec-tag strong { color: #0f766e; font-size: 1.15em; }
        .spec-type-pipe { border-left: 4px solid #3b82f6; } 
        .spec-type-short { border-left: 4px solid #f59e0b; } 
        .spec-type-cbeam { border-left: 4px solid #10b981; } 
        
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; align-items: stretch; }
        button { border: none; border-radius: 6px; cursor: pointer; padding: 15px 10px; font-size: 1.05em; font-weight: bold; transition: all 0.2s; line-height: 1.4; }
        button:disabled { cursor: not-allowed; opacity: 0.7; }
        button.reset-btn { background-color: #9ca3af; color: white; flex: 0.8; }
        button.reset-btn:hover { background-color: #6b7280; }
        button.submit-all-btn { background-color: #3b82f6; color: white; flex: 1.3; }
        button.submit-all-btn:hover:not(:disabled) { background-color: #2563eb; }
        button.submit-weight-btn { background-color: #f59e0b; color: white; flex: 1.6; border: 2px solid #d97706; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); font-size: 1.1em;}
        button.submit-weight-btn:hover:not(:disabled) { background-color: #d97706; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4); }
        .info-text { font-size: 0.9em; color: #6b7280; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏭 생산 공정: 견적 중량 & 일정 관리기</h2>

    <div class="manager-section">
        <label for="managerSelect" style="font-weight: bold; color: #1e293b;">👤 담당자:</label>
        <select id="managerSelect" onchange="saveManager()">
            <option value="">담당자 선택</option>
            <option value="오은규">오은규</option>
            <option value="전화진">전화진</option>
            <option value="김정석">김정석</option>
            <option value="김동주">김동주</option>
            <option value="김봉준">김봉준</option>
            <option value="정준우">정준우</option>
            <option value="황지훈">황지훈</option>
            <option value="노성현">노성현</option>
            <option value="권도희">권도희</option>
        </select>
        <span style="font-size: 0.85em; color: #64748b;">(자동 기억됩니다)</span>
    </div>
    
    <div class="form-type-selector">
        <input type="radio" id="typeSales" name="formType" value="sales" checked>
        <label for="typeSales">영업 견적서 기반</label>
        <input type="radio" id="typeDesign" name="formType" value="design">
        <label for="typeDesign">설계 산출서 기반</label>
    </div>

    <div class="upload-section" id="dropZone">
        <p style="margin-top: 0; font-weight: bold; color: #0f766e; pointer-events: none; font-size: 1.1em;">
            견적서/산출서 엑셀 파일을 이곳으로 드래그 하세요.<br>
            <span style="font-size: 0.85em; color: #6b7280; font-weight: normal;">(여러 파일 동시 업로드 가능)</span>
        </p>
        <div class="fake-btn">클릭하여 파일 선택</div>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .xlsb" multiple style="display: none;" />
    </div>

    <div id="resultArea" class="result-section">
        <div style="font-weight: bold; margin-bottom: 15px; font-size: 1.1em; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;">
            📋 추출된 현장별 규격 중량 데이터
        </div>
        <div id="resultList"></div>
        
        <div class="action-buttons">
            <button class="reset-btn" onclick="clearList()" id="resetBtn">초기화</button>
            <button class="submit-all-btn" onclick="sendToGoogleSheet('all')" id="submitAllBtn">전체 업데이트<br><span style="font-size: 0.75em; font-weight: normal;">(메인 + SAP)</span></button>
            <button class="submit-weight-btn" onclick="sendToGoogleSheet('weight')" id="submitWeightBtn">⭐ 중량만 업데이트<br><span style="font-size: 0.8em; font-weight: normal;">(메인 시트만)</span></button>
        </div>
        <p class="info-text">※ 공급가액(N) / 총중량(K) 기반 단가 자동 계산 적용</p>
    </div>
</div>

<script>
    let globalFileCounter = 0;

    document.addEventListener('DOMContentLoaded', () => {
        const savedManager = localStorage.getItem('selectedManager');
        if (savedManager) document.getElementById('managerSelect').value = savedManager;
    });

    function saveManager() {
        localStorage.setItem('selectedManager', document.getElementById('managerSelect').value);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function getNum(val) {
        if (val === undefined || val === null || val === "") return 0;
        let n = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
        return isNaN(n) ? 0 : n;
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('excelFile');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files; 
            processFiles(e.dataTransfer.files);     
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processFiles(e.target.files);
    });

    function clearList() {
        if(confirm("추출된 리스트를 모두 초기화하시겠습니까?")) {
            document.getElementById('resultList').innerHTML = '';
            document.getElementById('resultArea').style.display = "none";
            document.getElementById('excelFile').value = ''; 
            globalFileCounter = 0;
        }
    }

    function processFiles(files) {
        if (files.length === 0) return;
        let formType = document.querySelector('input[name="formType"]:checked').value;
        let resultList = document.getElementById('resultList');
        document.getElementById('resultArea').style.display = "block";

        Array.from(files).forEach((f) => {
            let currentId = globalFileCounter++; 
            let reader = new FileReader();

            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});
                    
                    let projectName = extractProjectName(workbook, formType);
                    let weights = extractWeightsBySpec(workbook, formType);
                    let accessories = extractAccessories(workbook, formType);

                    let specTagsHtml = "";
                    if (weights.length > 0) {
                        weights.forEach(w => {
                            specTagsHtml += `<div class="spec-tag spec-type-${w.type}">${w.name} <strong>${w.weight.toLocaleString('ko-KR', {maximumFractionDigits: 3})}</strong> kg</div>`;
                        });
                    }

                    let cardHtml = `
                        <div class="file-result-card" id="card_${currentId}" data-id="${currentId}">
                            <button class="delete-btn" onclick="document.getElementById('card_${currentId}').remove()" title="이 항목 삭제">✕</button>
                            <div class="file-name-title">📁 ${escapeHtml(f.name)}</div>
                            <div class="info-group">
                                <input type="text" id="proj_${currentId}" class="input-field" value="${escapeHtml(projectName)}" placeholder="프로젝트명(현장명)">
                                <label style="display: flex; align-items: center; gap: 8px; margin-top: 5px; cursor: pointer; color: #d97706; font-weight: bold; background: #fffbeb; padding: 10px; border-radius: 6px; border: 1px solid #fde68a;">
                                    <input type="checkbox" id="rev_${currentId}" style="width: 18px; height: 18px;">
                                    🔄 이 견적서는 수정본입니다
                                </label>
                            </div>
                            <div class="spec-list-wrapper">
                                <div class="spec-list">${specTagsHtml}</div>
                            </div>
                            <input type="hidden" id="specData_${currentId}" value='${JSON.stringify(weights)}'>
                            <input type="hidden" id="accData_${currentId}" value='${JSON.stringify(accessories)}'>
                            <input type="hidden" id="fileData64_${currentId}" value="">
                            <input type="hidden" id="fileName_${currentId}" value="${escapeHtml(f.name)}">
                        </div>
                    `;
                    resultList.insertAdjacentHTML('beforeend', cardHtml);
                    let base64Reader = new FileReader();
                    base64Reader.onload = function(b64Event) {
                        document.getElementById(`fileData64_${currentId}`).value = b64Event.target.result.split(',')[1];
                    };
                    base64Reader.readAsDataURL(f);
                } catch (error) { console.error(error); }
            };
            reader.readAsArrayBuffer(f);
        });
        document.getElementById('excelFile').value = ""; 
    }

    function extractProjectName(workbook, formType) {
        let company = "업체명미상", site = "현장명미상";
        try {
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            let data = XLSX.utils.sheet_to_json(sheet, {header: 1});
            if (formType === 'sales') {
                for (let i = 0; i < Math.min(20, data.length); i++) {
                    let row = data[i]; if (!row) continue;
                    for (let j = 0; j < row.length; j++) {
                        let val = String(row[j] || "");
                        if (val.includes("견") && val.includes("적")) {
                            let m = val.match(/\(([^)]+)\)/);
                            if (m) site = m[1].trim();
                        }
                    }
                }
                if (data[9] && data[9][2]) company = String(data[9][2]).replace(/주식회사/g, '').trim();
            } else {
                if (data[10] && data[10][2]) company = String(data[10][2]).replace(/주식회사/g, '').trim();
                if (data[0] && data[0][25]) site = String(data[0][25]).trim();
            }
        } catch(e) {}
        return `${company}(${site})`;
    }

    // ★ 단가 계산을 위해 공급가액(N열, index 13)을 추가 추출하도록 수정 ★
    function extractWeightsBySpec(workbook, formType) {
        let sheetName = workbook.SheetNames[0]; 
        let worksheet = workbook.Sheets[sheetName];
        let json_data = XLSX.utils.sheet_to_json(worksheet, {header: 1});
        const pipeSpecs = [[100,100,3.2],[100,100,3.0],[100,100,2.3],[100,100,2.1],[100,50,2.1],[75,75,2.1],[50,50,2.1]];
        const cSpecs = [[125,50,3.2],[125,50,3.0],[125,50,2.1],[100,50,3.2],[100,50,3.0],[100,50,2.3],[100,50,2.1],[75,45,2.3],[75,45,2.1]];
        let resultMap = {}; 
        
        for (let i = 0; i < json_data.length; i++) {
            let row = json_data[i];
            if (!row || row.length === 0 || String(row[1] || "").includes("소계")) continue;
            
            let weight = getNum(row[10]); // K열
            let priceVal = getNum(row[13]); // N열 (공급가액)
            if (weight <= 0) continue;
            
            let p_d1, p_d2, p_t, p_len, c_d1, c_d2, c_t, isNonPerf = false; 
            if (formType === 'sales') {
                p_d1 = getNum(row[2]); p_d2 = getNum(row[3]); p_t = getNum(row[4]); p_len = getNum(row[5]);
                c_d1 = getNum(row[2]); c_d2 = getNum(row[3]); c_t = getNum(row[5]);
                if (String(row[14] || "").includes("무타공")) isNonPerf = true;
            } else {
                p_d1 = getNum(row[4]); p_d2 = getNum(row[5]); p_t = getNum(row[6]); p_len = getNum(row[7]);
                c_d1 = getNum(row[4]); c_d2 = getNum(row[5]); c_t = getNum(row[7]);
                if (String(row[2] || "").includes("무타공")) isNonPerf = true;
            }

            let matchedPipe = pipeSpecs.find(s => s[0] === p_d1 && s[1] === p_d2 && s[2] === p_t);
            if (matchedPipe) {
                let type = p_len >= 2 ? 'pipe' : 'short';
                let specStr = (isNonPerf ? "[무타공] " : "") + (type === 'pipe' ? "각관 " : "단척 ") + `${p_d1}x${p_d2}x${p_t}`;
                let key = `pipe_${specStr}`;
                if(!resultMap[key]) resultMap[key] = { type: type, name: specStr, spec: specStr, weight: 0, totalPrice: 0 };
                resultMap[key].weight += weight;
                resultMap[key].totalPrice += priceVal;
                continue; 
            }
            let matchedC = cSpecs.find(s => s[0] === c_d1 && s[1] === c_d2 && s[2] === c_t);
            if (matchedC) {
                let specStr = (isNonPerf ? "[무타공] " : "") + `C형강 ${c_d1}x${c_d2}x${c_t}`;
                let key = `cbeam_${specStr}`;
                if(!resultMap[key]) resultMap[key] = { type: 'cbeam', name: specStr, spec: specStr, weight: 0, totalPrice: 0 };
                resultMap[key].weight += weight;
                resultMap[key].totalPrice += priceVal;
            }
        }
        return Object.values(resultMap);
    }

    function extractAccessories(workbook, formType) {
        let hasBracket = false, hasBolt = false;
        try {
            let worksheet = workbook.Sheets[workbook.SheetNames[0]];
            let data = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            let current = ""; 
            for (let i = 0; i < data.length; i++) {
                let r = data[i]; if (!r) continue;
                let s = r.join("").replace(/\s/g, ''); 
                if (s.includes("부자재") || s.includes("브라켓")) current = 'bracket';
                if (s.toUpperCase().includes("BOLTSET") || s.includes("볼트")) current = 'bolt';
                if (String(r[1] || "").includes("소계") && getNum(r[7]) > 0) {
                    if (current === 'bracket') hasBracket = true;
                    if (current === 'bolt') hasBolt = true;
                    current = ""; 
                }
            }
        } catch(e) {}
        return { hasBracket, hasBolt };
    }

    async function sendToGoogleSheet(updateMode) {
        const cards = document.querySelectorAll('.file-result-card[data-id]');
        if (cards.length === 0) return alert("데이터가 없습니다.");
        const mgr = document.getElementById('managerSelect').value;
        if (!mgr) return alert("담당자를 선택하세요.");

        const btnW = document.getElementById('submitWeightBtn'), btnA = document.getElementById('submitAllBtn');
        btnW.disabled = btnA.disabled = true;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyL0UY7GZOSQo--ILhXTeu-2REwJcHA3OljNRcozOuwXhVZ2T7MLUV8hXVwUTwJPkcx/exec"; 

        let now = new Date();
        let dateStr = `${String(now.getFullYear()).slice(-2)}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        for (let i = 0; i < cards.length; i++) {
            let id = cards[i].getAttribute('data-id');
            let proj = document.getElementById(`proj_${id}`).value.trim();
            let isRev = document.getElementById(`rev_${id}`).checked;
            let specs = JSON.parse(document.getElementById(`specData_${id}`).value);
            let acc = JSON.parse(document.getElementById(`accData_${id}`).value);
            let fData = document.getElementById(`fileData64_${id}`).value;
            let fName = `[${dateStr.split(' ')[0]}]_${proj}_${document.getElementById(`fileName_${id}`).value}`;

            const payload = {
                action: "upload_data", updateMode: updateMode, isRevision: isRev,
                date: dateStr, year: now.getFullYear(), month: now.getMonth() + 1, project: proj,
                items: specs, hasBracket: acc.hasBracket ? "O" : "", hasBolt: acc.hasBolt ? "O" : "", manager: mgr,
                tempText: `⏳ [${fName}] 백업 중...`
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "upload_file", fileData: fData, fileName: fName, tempText: payload.tempText }) });
            } catch (e) { console.error(e); }
        }
        alert("업데이트 완료!");
        btnW.disabled = btnA.disabled = false;
        clearList();
    }
</script>

</body>
</html>
